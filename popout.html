<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Revival Studio</title>
    <style>
      /* PUI2 popout window — a single-entry detail surface in its own
         BrowserWindow. Shares the dark/light theme + accent vocabulary with
         the main app via a CSS-variable subset so visual feel matches without
         duplicating the full stylesheet. */
      :root, :root[data-theme='dark'] {
        --bg: #1a1a1a;
        --panel: #232323;
        --border: #333333;
        --hover: #2c2c2c;
        --text: #e8e8e8;
        --muted: #9a9a9a;
        --accent: #c98b5e;
      }
      :root[data-theme='light'] {
        --bg: #f6f4f1;
        --panel: #ffffff;
        --border: #e2ddd6;
        --hover: #ece8e2;
        --text: #2a2723;
        --muted: #6b655d;
        --accent: #b3713f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* Window frame: a thin top bar names the workspace + entry type so
         "Where am I" stays answered when the popout is detached from the
         main window. The detail card sits in a centered column below it. */
      #popout-root {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 24px 28px 28px;
        gap: 16px;
        max-width: 980px;
        margin: 0 auto;
      }
      .po-frame-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .po-frame-bar .po-frame-dot { color: var(--accent); }
      .po-frame-bar .po-frame-mode {
        margin-left: auto;
        font-style: italic;
        text-transform: none;
        letter-spacing: 0;
      }

      .po-detail {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 18px 20px;
        overflow: auto;
        flex: 1;
        min-height: 0;
      }

      /* Shared detail typography — kept in sync with .tc-detail-* in index.html
         so an entry looks the same in the popout as in the main window. */
      .tc-detail-header {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
        word-wrap: break-word;
      }
      .tc-detail-meta {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .tc-detail-body {
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        margin-bottom: 16px;
      }
      .tc-detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .tc-detail-actions button {
        font: inherit;
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
      }

      /* PPASSIVE — linked-entries indicator + status bar, in sync with index.html. */
      .tc-linked { margin-top: 16px; }
      .tc-linked > summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--text);
        list-style: none;
        user-select: none;
        padding: 4px 0;
        display: inline-block;
      }
      .tc-linked > summary::-webkit-details-marker { display: none; }
      .tc-linked > summary:hover { color: var(--accent); }
      .tc-linked-summary.tc-linked-empty {
        color: var(--muted);
        cursor: default;
        pointer-events: none;
      }
      .tc-linked-body { padding: 4px 0 0 2px; }
      .tc-linked-heading {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 8px 0 3px;
      }
      .tc-linked-row {
        font-size: 13px;
        padding: 3px 0;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--border);
      }
      .tc-linked-src { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .tc-statusbar {
        margin-top: 18px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 11px;
        color: var(--muted);
      }
      .tc-statusbar-key {
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-right: 5px;
        opacity: 0.7;
      }

      .btn-primary {
        font-weight: 600;
        background: var(--accent);
        color: #1a1a1a;
        border: none;
      }
      .btn-primary:disabled { opacity: 0.45; cursor: default; }
      .btn-secondary {
        background: none;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover { background: var(--hover); }
      .btn-danger {
        background: none;
        color: #e06c6c;
        border: 1px solid #e06c6c;
      }
      .btn-danger:hover { background: #e06c6c; color: #fff; }
      .btn-danger:disabled { opacity: 0.5; cursor: default; }
      .confirm-row { align-items: center; flex-wrap: wrap; }
      .confirm-text { font-size: 13px; color: var(--muted); margin-right: 4px; }

      .draft-status { color: var(--muted); font-size: 12px; font-style: italic; margin: 0; }
      .form-error { color: #e06c6c; font-size: 13px; margin: 0; }
      .draft-badge {
        font-size: 12px;
        color: var(--accent);
        margin-top: 6px;
      }

      /* Edit-mode inputs — borrow the wl-* sizing so editing in the popout
         feels like the main app's edit form. */
      .wl-title {
        font: inherit; font-size: 19px; font-weight: 600; width: 100%;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px;
        padding: 10px 12px; margin-bottom: 10px;
      }
      .wl-title:focus { outline: none; border-color: var(--accent); }
      .wl-body {
        font: inherit; font-size: 15px; line-height: 1.6; width: 100%;
        min-height: 50vh; resize: vertical;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px;
        padding: 14px 16px;
      }
      .wl-body:focus { outline: none; border-color: var(--accent); }

      /* Workspace accents — visual continuity with the main app. */
      .ws-conflicts .po-detail { border-left: 3px solid #e06c6c; }
      .ws-conflicts .tc-detail-header::before { content: '⚠ '; color: #e06c6c; }
      .ws-research .po-detail { border-left: 3px solid #5a8fd6; }
      .ws-research .tc-detail-header::before { content: '🔎 '; color: #5a8fd6; }
      .ws-characters .po-detail { border-left: 3px solid #9b7fd6; }
      .ws-characters .tc-detail-header::before { content: '👤 '; color: #9b7fd6; }
      .ws-episodes .po-detail { border-left: 3px solid #d6a14f; }
      .ws-episodes .tc-detail-header::before { content: '🎬 '; color: #d6a14f; }

      /* P35 — Canon Review proposal popout. Mirrors the cr-* + canon-field-*
         rules in index.html so the popout reads as the same surface in a
         second window. */
      .canon-field { display: flex; flex-direction: column; gap: 4px; }
      .canon-field-label {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .canon-field-input {
        font: inherit;
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        margin: 0;
      }
      textarea.canon-field-input { resize: vertical; min-height: 60px; }
      .cr-edit-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }
      .cr-edit-actions { margin-top: 4px; }
      .cr-verb-actions { margin-top: 14px; }
      .cr-note-row .canon-field-input { flex: 1 1 240px; }
      .cr-review-note {
        margin: 6px 0 12px;
        padding: 8px 10px;
        border-left: 3px solid #d6a14f;
        background: rgba(214, 161, 79, 0.06);
        font-size: 13px;
        color: var(--text);
        border-radius: 4px;
      }

      .po-missing {
        display: flex; flex-direction: column; gap: 8px; align-items: center;
        justify-content: center; height: 100%;
        color: var(--muted); text-align: center; font-size: 14px;
      }
      .po-missing-title { font-size: 16px; color: var(--text); }

      /* PUI3 extract-and-route menu + toast (kept visually identical to the
         main window so the popout doesn't feel like a separate app). */
      .extract-menu {
        position: absolute;
        z-index: 80;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 180px;
        max-width: 260px;
        padding: 8px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
      }
      .extract-menu[hidden] { display: none; }
      .extract-menu.extract-menu-busy { opacity: 0.6; pointer-events: none; }
      .extract-menu-label {
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 2px 4px 4px;
      }
      .extract-menu-list { display: flex; flex-direction: column; gap: 2px; }
      .extract-menu-item {
        font: inherit;
        font-size: 13px;
        text-align: left;
        background: none;
        color: var(--text);
        border: none;
        border-radius: 6px;
        padding: 6px 9px;
        cursor: pointer;
      }
      .extract-menu-item:hover {
        background: var(--hover);
        color: var(--accent);
      }
      .extract-menu-recent { display: flex; flex-direction: column; gap: 2px; }
      .extract-menu-recent[hidden] { display: none; }
      .extract-menu-recent-header {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 4px 4px 2px;
      }
      .extract-menu-recent + .extract-menu-list {
        border-top: 1px solid var(--border);
        padding-top: 4px;
        margin-top: 2px;
      }
      .extract-toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 90;
        font-size: 13px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 16px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.28);
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      .extract-toast[hidden] { display: none; }
      .extract-toast.extract-toast-visible { opacity: 1; }

      /* PTAG — same chip/picker vocabulary as the main window. */
      .tagbar { margin: 14px 0 0 0; display: flex; flex-direction: column; gap: 8px; }
      .tagbar-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
      .tag-chip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 12px; padding: 2px 6px 2px 8px;
        border-radius: 999px; border: 1px solid var(--border);
        background: var(--bg); color: var(--text);
      }
      .tag-chip-name { line-height: 1.4; }
      .tag-chip-remove {
        background: none; border: none; color: var(--muted);
        cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1;
      }
      .tag-chip-remove:hover { color: var(--accent); }
      .tag-add-btn {
        font: inherit; font-size: 12px;
        background: transparent; color: var(--muted);
        border: 1px dashed var(--border); border-radius: 999px;
        padding: 2px 10px; cursor: pointer;
      }
      .tag-add-btn:hover { color: var(--accent); border-color: var(--accent); }
      .tag-clear-btn { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: none; padding: 2px 6px; cursor: pointer; }
      .tag-clear-btn:hover { color: var(--accent); }
      .tag-clear-btn:disabled { opacity: 0.5; cursor: default; }
      .tag-picker {
        margin-top: 6px; padding: 10px;
        border: 1px solid var(--border); border-radius: 6px;
        background: var(--bg);
        display: flex; flex-direction: column; gap: 8px;
        max-height: 360px; overflow: auto;
      }
      .tag-picker-search { display: flex; gap: 6px; align-items: center; }
      .tag-picker-input {
        flex: 1; font: inherit; font-size: 13px; padding: 6px 8px;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px;
      }
      .tag-picker-input:focus { outline: none; border-color: var(--accent); }
      .tag-picker-close {
        background: none; border: none; color: var(--muted);
        font-size: 18px; cursor: pointer; padding: 0 4px;
      }
      .tag-picker-close:hover { color: var(--accent); }
      .tag-picker-create-btn {
        font: inherit; font-size: 12px; text-align: left;
        background: transparent; color: var(--accent);
        border: 1px dashed var(--accent); border-radius: 6px;
        padding: 6px 8px; cursor: pointer;
      }
      .tag-picker-groups { display: flex; flex-direction: column; gap: 4px; }
      .tag-picker-cat > summary {
        cursor: pointer; font-size: 12px; color: var(--muted);
        padding: 4px 0; list-style: none;
      }
      .tag-picker-cat > summary::-webkit-details-marker { display: none; }
      .tag-picker-cat > summary::before { content: '▸ '; color: var(--muted); }
      .tag-picker-cat[open] > summary::before { content: '▾ '; }
      .tag-picker-row {
        display: flex; flex-wrap: wrap; gap: 4px;
        padding: 2px 0 6px 14px;
      }
      .tag-picker-tag {
        font: inherit; font-size: 12px;
        background: transparent; color: var(--text);
        border: 1px solid var(--border); border-radius: 999px;
        padding: 2px 8px; cursor: pointer;
      }
      .tag-picker-tag:hover { border-color: var(--accent); }
      .tag-picker-tag.attached {
        background: var(--accent); color: var(--bg); border-color: var(--accent);
      }
      .tag-picker-empty { font-size: 12px; color: var(--muted); margin: 4px 0; }

      /* PAUDIT-3 — Canon Bible popout. Mirrors canon-type-badge + canon-chip-*
         from index.html so the read-only view is styled consistently. */
      .canon-type-badge {
        display: inline-block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: rgba(214, 161, 79, 0.18);
        color: #d6a14f;
        border-radius: 4px;
        padding: 2px 7px;
        margin-bottom: 10px;
      }
      .canon-chips {
        display: flex; gap: 6px; flex-wrap: wrap;
        margin: 8px 0;
      }
      .canon-chip {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
      }
      .canon-chip-locked { color: #d6a14f; border-color: #d6a14f; }
      .canon-chip-retired { color: #888; border-color: #888; }
      .canon-chip-provisional { color: #c79a55; border-color: #c79a55; }
    </style>
  </head>
  <body>
    <div id="popout-root"></div>
    <script src="extract.js"></script>
    <script src="tags-ui.js"></script>
    <script src="popout.js"></script>
  </body>
</html>
