<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Revival Studio</title>
    <style>
      /* Dark is the default theme; light overrides below.
         All colors are CSS variables so later phases inherit theming for free. */
      :root, :root[data-theme='dark'] {
        --bg: #1a1a1a;
        --panel: #232323;
        --border: #333333;
        --hover: #2c2c2c;
        --text: #e8e8e8;
        --muted: #9a9a9a;
        --accent: #c98b5e;
      }
      :root[data-theme='light'] {
        --bg: #f6f4f1;
        --panel: #ffffff;
        --border: #e2ddd6;
        --hover: #ece8e2;
        --text: #2a2723;
        --muted: #6b655d;
        --accent: #b3713f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #app { display: flex; height: 100%; }

      #nav {
        width: 220px;
        flex: 0 0 220px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 12px 0;
      }
      #nav .brand {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 4px 18px 14px;
      }
      #nav button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        padding: 9px 18px;
        cursor: pointer;
      }
      #nav button:hover { background: var(--hover); }
      #nav button.active {
        background: var(--hover);
        color: var(--accent);
        box-shadow: inset 3px 0 0 var(--accent);
        font-weight: 600;
      }

      #theme-toggle {
        margin: 14px 18px 4px;
        width: calc(100% - 36px);
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        padding: 7px 10px;
        cursor: pointer;
      }
      #theme-toggle:hover { background: var(--hover); color: var(--text); }

      #content {
        flex: 1;
        overflow-y: auto;
        padding: 40px 48px;
      }
      #content h1 { margin: 0 0 8px; font-size: 26px; }
      #content .placeholder { color: var(--muted); font-size: 15px; }

      dl.principles {
        margin: 28px 0 0;
        max-width: 720px;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      dl.principles dt {
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 10px 18px 4px;
      }
      dl.principles dd {
        margin: 0;
        padding: 0 18px 14px;
        font-size: 14px;
        line-height: 1.45;
        border-bottom: 1px solid var(--border);
      }
      dl.principles dd:last-child { border-bottom: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="nav"><div class="brand">Revival Studio</div></nav>
      <main id="content"></main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
