<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Revival Studio</title>
    <style>
      /* Dark is the default theme; light overrides below.
         All colors are CSS variables so later phases inherit theming for free. */
      :root, :root[data-theme='dark'] {
        --bg: #1a1a1a;
        --panel: #232323;
        --border: #333333;
        --hover: #2c2c2c;
        --text: #e8e8e8;
        --muted: #9a9a9a;
        --accent: #c98b5e;
      }
      :root[data-theme='light'] {
        --bg: #f6f4f1;
        --panel: #ffffff;
        --border: #e2ddd6;
        --hover: #ece8e2;
        --text: #2a2723;
        --muted: #6b655d;
        --accent: #b3713f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #app { display: flex; height: 100%; }

      #nav {
        width: 220px;
        flex: 0 0 220px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        /* Extra top padding clears the small fixed Panic Export icon (top-left). */
        padding: 44px 0 12px;
      }

      /* --- Panic Export sticky button (P21) --------------------------------
         A small, unobtrusive lightning icon in the top-left corner. z-index
         above the chat drawer (40) and toggle (30) so the backup control is
         always reachable and never covered, without dominating the UI. */
      #panic-export {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 60;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        line-height: 1;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.12s ease, border-color 0.12s ease;
      }
      #panic-export:hover {
        opacity: 1;
        border-color: var(--accent);
      }
      #panic-export:disabled { cursor: default; }
      #nav .brand {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 4px 18px 14px;
      }
      #nav button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        padding: 9px 18px;
        cursor: pointer;
      }
      #nav button:hover { background: var(--hover); }
      #nav button.active {
        background: var(--hover);
        color: var(--accent);
        box-shadow: inset 3px 0 0 var(--accent);
        font-weight: 600;
      }

      /* Theme toggle (P4): a small sun/moon icon sitting just to the right of
         the Panic Export bolt, top-left. Matches the bolt's compact, faded
         style so the two read as a small corner cluster, not chrome. */
      #theme-toggle {
        position: fixed;
        top: 8px;
        left: 42px;
        z-index: 60;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        line-height: 1;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.12s ease, border-color 0.12s ease;
      }
      #theme-toggle:hover {
        opacity: 1;
        border-color: var(--accent);
      }

      #content {
        flex: 1;
        overflow-y: auto;
        padding: 40px 48px;
      }
      #content h1 { margin: 0 0 8px; font-size: 26px; }
      #content .placeholder { color: var(--muted); font-size: 15px; }

      .ws-content { max-width: 720px; margin-top: 28px; }

      .entry-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .entry-form input,
      .entry-form textarea {
        font: inherit;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 11px;
        resize: vertical;
      }
      .entry-form input:focus,
      .entry-form textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      .entry-form button {
        align-self: flex-start;
        font: inherit;
        font-weight: 600;
        background: var(--accent);
        color: #1a1a1a;
        border: none;
        border-radius: 6px;
        padding: 9px 16px;
        cursor: pointer;
      }
      .entry-form button:disabled { opacity: 0.45; cursor: default; }
      .upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .upload-hint { color: var(--muted); font-size: 12px; }
      .form-error { color: #e06c6c; font-size: 13px; margin: 0; }
      .draft-status { color: var(--muted); font-size: 12px; font-style: italic; margin: 0; }
      .settings-heading { margin: 0; font-size: 16px; }
      .settings-desc { color: var(--muted); font-size: 13px; margin: 0; }
      .settings-block textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .draft-badge {
        font-size: 12px;
        color: var(--accent);
        margin-top: 6px;
      }

      .entry-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
      .entry-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .entry-title { font-size: 15px; font-weight: 600; }
      .entry-body {
        font-size: 14px;
        color: var(--text);
        margin-top: 4px;
        white-space: pre-wrap;
      }
      .entry-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }

      /* Conflicts: visibly distinct from Open Questions (a red contradiction
         accent on each card + the new-conflict form). */
      .ws-conflicts .entry-card {
        border-left: 3px solid #e06c6c;
      }
      .ws-conflicts .entry-form {
        border-left: 3px solid #e06c6c;
        padding-left: 12px;
      }
      .ws-conflicts .entry-title::before {
        content: '⚠ ';
        color: #e06c6c;
      }

      /* Research: visibly distinct from Brainstorm (a blue source accent on
         each card + the new-research form). */
      .ws-research .entry-card {
        border-left: 3px solid #5a8fd6;
      }
      .ws-research .entry-form {
        border-left: 3px solid #5a8fd6;
        padding-left: 12px;
      }
      .ws-research .entry-title::before {
        content: '🔎 ';
        color: #5a8fd6;
      }

      /* Characters: a violet accent so the development surface reads distinctly
         from the queue/decision workspaces. */
      .ws-characters .entry-card {
        border-left: 3px solid #9b7fd6;
      }
      .ws-characters .entry-form {
        border-left: 3px solid #9b7fd6;
        padding-left: 12px;
      }
      .ws-characters .entry-title::before {
        content: '👤 ';
        color: #9b7fd6;
      }

      /* Episodes: an amber accent so the drafting surface reads distinctly from
         Characters and the queue/decision workspaces. */
      .ws-episodes .entry-card {
        border-left: 3px solid #d6a14f;
      }
      .ws-episodes .entry-form {
        border-left: 3px solid #d6a14f;
        padding-left: 12px;
      }
      .ws-episodes .entry-title::before {
        content: '🎬 ';
        color: #d6a14f;
      }

      .entry-card input,
      .entry-card textarea {
        font: inherit;
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 11px;
        margin-bottom: 8px;
        resize: vertical;
      }
      .entry-card input:focus,
      .entry-card textarea:focus { outline: none; border-color: var(--accent); }

      .entry-actions { display: flex; gap: 8px; margin-top: 8px; }
      .entry-actions button { font: inherit; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
      .btn-primary {
        font-weight: 600;
        background: var(--accent);
        color: #1a1a1a;
        border: none;
      }
      .btn-primary:disabled { opacity: 0.45; cursor: default; }
      .btn-secondary {
        background: none;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover { background: var(--hover); }
      .btn-danger {
        background: none;
        color: #e06c6c;
        border: 1px solid #e06c6c;
      }
      .btn-danger:hover { background: #e06c6c; color: #fff; }
      .btn-danger:disabled { opacity: 0.5; cursor: default; }
      .confirm-row { align-items: center; flex-wrap: wrap; }
      .confirm-text { font-size: 13px; color: var(--muted); margin-right: 4px; }

      .archived-section { margin-top: 28px; }
      .archived-section > summary {
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 6px 0;
        user-select: none;
      }
      .archived-section > summary:hover { color: var(--text); }
      .archived-section .entry-list { margin-top: 12px; }

      /* --- Home dashboard (P27) --------------------------------------- */
      .home-section-label {
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 26px 0 10px;
      }
      .home-suggestions-head,
      .home-recent-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 4px 0 10px;
      }
      .home-recent-head { margin-top: 26px; }
      .home-suggestions-head .home-section-label,
      .home-recent-head .home-section-label { margin: 0; }
      .suggestions-refresh {
        font: inherit;
        font-size: 12px;
        color: var(--text);
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .suggestions-refresh:hover { border-color: var(--accent); background: var(--hover); }
      .suggestions-refresh:disabled { opacity: 0.5; cursor: default; }

      .home-suggestions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
      }
      .suggestion-card {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        padding: 9px 28px 9px 11px;
        cursor: pointer;
      }
      .suggestion-card:hover { border-color: var(--accent); background: var(--hover); }
      .suggestion-text {
        font-size: 13px;
        line-height: 1.35;
        color: var(--text);
      }
      .suggestion-dismiss {
        position: absolute;
        top: 4px;
        right: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        font: inherit;
        font-size: 12px;
        line-height: 1;
        color: var(--muted);
        background: none;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .suggestion-dismiss:hover { background: var(--hover); color: var(--text); }

      .home-counts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 6px;
      }
      .count-cell {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 5px;
        text-align: left;
        font: inherit;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .count-cell:hover { border-color: var(--accent); background: var(--hover); }
      .count-number { font-size: 16px; font-weight: 600; line-height: 1.1; }
      .count-label { font-size: 12px; color: var(--muted); }
      .count-archived { font-size: 10px; color: var(--muted); }

      .home-recent {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
      }
      .recent-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 3px;
        text-align: left;
        font: inherit;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 26px 7px 10px;
        cursor: pointer;
      }
      .recent-card:hover { border-color: var(--accent); background: var(--hover); }
      .recent-clear {
        position: absolute;
        top: 3px;
        right: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        font: inherit;
        font-size: 11px;
        line-height: 1;
        color: var(--muted);
        background: none;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .recent-clear:hover { background: var(--hover); color: var(--text); }
      .recent-foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        white-space: nowrap;
        overflow: hidden;
      }
      .recent-ws {
        font-size: 10px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .recent-title {
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .recent-meta { font-size: 11px; color: var(--muted); }

      /* --- Global Chat drawer (P14) ----------------------------------- */
      /* Fixed toggle, always visible so the drawer is reachable from any
         workspace. The drawer overlays the right edge without taking over
         the app — the rest stays clickable. */
      #chat-toggle {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 30;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        background: var(--accent);
        color: #1a1a1a;
        border: none;
        border-radius: 999px;
        padding: 11px 18px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      }
      #chat-toggle:hover { filter: brightness(1.06); }

      #chat-drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: 380px;
        max-width: 90vw;
        z-index: 40;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.28);
        transform: translateX(100%);
        transition: transform 0.18s ease;
      }
      #chat-drawer.open { transform: translateX(0); }
      /* Expand mode (P17): a larger view, not a full-screen takeover. The
         drawer widens but max-width leaves the left nav and content visible
         and clickable — the rest of the app stays reachable. */
      #chat-drawer.expanded { width: 760px; max-width: 72vw; }

      .chat-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
      }
      .chat-heading { flex: 1; min-width: 0; }
      #chat-select {
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        max-width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 9px;
        cursor: pointer;
      }
      #chat-select:disabled { opacity: 0.6; cursor: default; }
      #chat-select:focus { outline: none; border-color: var(--accent); }
      .chat-header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
      #chat-new { font: inherit; font-size: 13px; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      .chat-subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }
      #chat-close {
        background: none;
        border: none;
        color: var(--muted);
        font: inherit;
        font-size: 16px;
        line-height: 1;
        padding: 4px 6px;
        cursor: pointer;
        border-radius: 6px;
      }
      #chat-close:hover { background: var(--hover); color: var(--text); }
      #chat-expand {
        background: none;
        border: none;
        color: var(--muted);
        font: inherit;
        font-size: 16px;
        line-height: 1;
        padding: 4px 6px;
        cursor: pointer;
        border-radius: 6px;
      }
      #chat-expand:hover { background: var(--hover); color: var(--text); }
      #chat-expand[aria-pressed="true"] { color: var(--accent); }

      /* Active-chat tools + inline rename (P16) */
      .chat-tools {
        display: flex;
        gap: 8px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--border);
      }
      /* display:flex overrides the [hidden] attribute, so re-hide explicitly. */
      .chat-tools[hidden],
      .chat-rename-row[hidden] { display: none; }
      .btn-tool {
        font: inherit;
        font-size: 12px;
        background: none;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .btn-tool:hover { background: var(--hover); }
      .btn-tool:disabled { opacity: 0.45; cursor: default; }
      .chat-rename-row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 18px;
        border-bottom: 1px solid var(--border);
      }
      .chat-rename-row input {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 14px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 10px;
      }
      .chat-rename-row input:focus { outline: none; border-color: var(--accent); }
      .chat-rename-row .btn-primary,
      .chat-rename-row .btn-secondary {
        font: inherit;
        font-size: 13px;
        border-radius: 6px;
        padding: 7px 12px;
        cursor: pointer;
      }

      .chat-archived {
        border-top: 1px solid var(--border);
        padding: 0 18px;
      }
      .chat-archived > summary {
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 12px 0;
        user-select: none;
      }
      .chat-archived > summary:hover { color: var(--text); }
      .chat-archived-list { padding-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
      .chat-archived-item {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
      }
      .chat-archived-item .archived-title {
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chat-messages { flex: 1; overflow-y: auto; padding: 18px; }
      .chat-empty {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
      }

      /* --- Active sources bar (P18) ----------------------------------- */
      .chat-sources {
        border-top: 1px solid var(--border);
        padding: 10px 18px;
      }
      .chat-sources-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .chat-sources-label {
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .chat-sources-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .chat-sources-empty { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
      .source-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        font-size: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 10px;
      }
      .source-chip .chip-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .source-chip .chip-archived { color: var(--muted); font-style: italic; }
      /* "next message only" chips read as transient: dashed border + a badge. */
      .source-chip.chip-next { border-style: dashed; }
      .source-chip .chip-mode {
        font-size: 10px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
      .source-chip .chip-remove {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        padding: 0;
        font: inherit;
        font-size: 13px;
        line-height: 1;
        color: var(--muted);
        background: none;
        border: none;
        border-radius: 999px;
        cursor: pointer;
      }
      .source-chip .chip-remove:hover { color: var(--text); background: var(--hover); }
      /* Picker rows carry the title plus the two attach-mode buttons. */
      .picker-item {
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        padding: 6px 10px;
      }
      .picker-item:last-child { border-bottom: none; }
      .picker-title {
        flex: 1;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .picker-mode-btn {
        font: inherit;
        font-size: 11px;
        white-space: nowrap;
        background: none;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 9px;
        cursor: pointer;
      }
      .picker-mode-btn:hover { background: var(--hover); }
      .picker-mode-btn:disabled { opacity: 0.5; cursor: default; }
      .chat-source-picker {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        max-height: 200px;
        overflow-y: auto;
      }
      .chat-source-picker[hidden] { display: none; }
      .picker-hint { font-size: 12px; color: var(--muted); padding: 8px 10px; margin: 0; }

      .chat-composer {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 14px 18px;
        border-top: 1px solid var(--border);
      }
      .chat-input {
        flex: 1;
        font: inherit;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 11px;
        resize: none;
      }
      .chat-input:disabled { opacity: 0.7; cursor: not-allowed; }
      .chat-composer .btn-primary { padding: 8px 16px; }
    </style>
  </head>
  <body>
    <!-- Panic Export (P21): sticky safety button, top-left corner, above every
         layer (incl. the chat drawer) so a full backup is always one click
         away and never covered. Saves to Documents/revival-bible-studio/
         panic_exports — same action as the Settings button. -->
    <button id="panic-export" type="button"
            aria-label="Panic Export — save a full backup now"
            title="Panic Export — save a full backup now">⚡</button>
    <div id="app">
      <nav id="nav"><div class="brand">Revival Studio</div></nav>
      <main id="content"></main>
    </div>

    <!-- Global Chat drawer (P14): reachable from every workspace. Shell only —
         AI send/receive is wired up in a later phase. -->
    <button id="chat-toggle" aria-expanded="false" aria-controls="chat-drawer">
      💬 Chat
    </button>
    <aside id="chat-drawer" aria-hidden="true" aria-label="Chat">
      <header class="chat-header">
        <div class="chat-heading">
          <select id="chat-select" aria-label="Active chat" disabled></select>
          <div class="chat-subtitle">Switch chats from the dropdown · reachable from anywhere</div>
        </div>
        <div class="chat-header-actions">
          <button id="chat-new" class="btn-secondary" type="button">+ New chat</button>
          <button id="chat-expand" type="button" aria-pressed="false" aria-label="Expand chat" title="Expand chat">⤢</button>
          <button id="chat-close" aria-label="Close chat">✕</button>
        </div>
      </header>
      <div class="chat-tools" id="chat-tools">
        <button id="chat-rename" class="btn-tool" type="button">Rename</button>
        <button id="chat-archive" class="btn-tool" type="button">Archive</button>
      </div>
      <form class="chat-rename-row" id="chat-rename-row" hidden>
        <input id="chat-rename-input" type="text" aria-label="Chat title" />
        <button id="chat-rename-save" class="btn-primary" type="submit">Save</button>
        <button id="chat-rename-cancel" class="btn-secondary" type="button">Cancel</button>
      </form>
      <div class="chat-messages" id="chat-messages"></div>
      <details class="chat-archived" id="chat-archived" hidden>
        <summary>Archived chats</summary>
        <div class="chat-archived-list" id="chat-archived-list"></div>
      </details>
      <!-- Active sources: always visible so the user knows exactly what Claude
           would use. Source Material is the only attachable type. Two modes
           (P19): "keep active" (persisted, stays listed) and "next message
           only" (ephemeral, cleared on the next draft send). Every chip has a
           one-click remove. -->
      <section class="chat-sources" id="chat-sources" aria-label="Active sources">
        <div class="chat-sources-head">
          <span class="chat-sources-label">Active sources</span>
          <button id="chat-attach" class="btn-tool" type="button">+ Attach source</button>
        </div>
        <div class="chat-sources-list" id="chat-sources-list"></div>
        <div class="chat-source-picker" id="chat-source-picker" hidden></div>
      </section>
      <!-- Draft send (P19): no AI yet. Send clears the box and any "next message
           only" sources so that mode can be demonstrated. Nothing is stored or
           sent to Claude — real messaging arrives in a later phase. -->
      <form class="chat-composer" id="chat-composer">
        <textarea
          id="chat-input"
          class="chat-input"
          rows="2"
          placeholder="Draft send only — clears the box and any “next message only” sources. Claude messaging comes later; nothing is saved or sent."
        ></textarea>
        <button id="chat-send" type="submit" class="btn-primary">Send</button>
      </form>
    </aside>

    <script src="renderer.js"></script>
  </body>
</html>
