<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Revival Studio</title>
    <style>
      /* Dark is the default theme; light overrides below.
         All colors are CSS variables so later phases inherit theming for free. */
      :root, :root[data-theme='dark'] {
        --bg: #1a1a1a;
        --panel: #232323;
        --border: #333333;
        --hover: #2c2c2c;
        --text: #e8e8e8;
        --muted: #9a9a9a;
        --accent: #c98b5e;
      }
      :root[data-theme='light'] {
        --bg: #f6f4f1;
        --panel: #ffffff;
        --border: #e2ddd6;
        --hover: #ece8e2;
        --text: #2a2723;
        --muted: #6b655d;
        --accent: #b3713f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #app { display: flex; height: 100%; }

      #nav {
        width: 220px;
        flex: 0 0 220px;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 12px 0;
      }
      #nav .brand {
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 4px 18px 14px;
      }
      #nav button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        padding: 9px 18px;
        cursor: pointer;
      }
      #nav button:hover { background: var(--hover); }
      #nav button.active {
        background: var(--hover);
        color: var(--accent);
        box-shadow: inset 3px 0 0 var(--accent);
        font-weight: 600;
      }

      #theme-toggle {
        margin: 14px 18px 4px;
        width: calc(100% - 36px);
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        padding: 7px 10px;
        cursor: pointer;
      }
      #theme-toggle:hover { background: var(--hover); color: var(--text); }

      #content {
        flex: 1;
        overflow-y: auto;
        padding: 40px 48px;
      }
      #content h1 { margin: 0 0 8px; font-size: 26px; }
      #content .placeholder { color: var(--muted); font-size: 15px; }

      dl.principles {
        margin: 28px 0 0;
        max-width: 720px;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      dl.principles dt {
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 10px 18px 4px;
      }
      dl.principles dd {
        margin: 0;
        padding: 0 18px 14px;
        font-size: 14px;
        line-height: 1.45;
        border-bottom: 1px solid var(--border);
      }
      dl.principles dd:last-child { border-bottom: none; }

      .ws-content { max-width: 720px; margin-top: 28px; }

      .entry-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .entry-form input,
      .entry-form textarea {
        font: inherit;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 11px;
        resize: vertical;
      }
      .entry-form input:focus,
      .entry-form textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      .entry-form button {
        align-self: flex-start;
        font: inherit;
        font-weight: 600;
        background: var(--accent);
        color: #1a1a1a;
        border: none;
        border-radius: 6px;
        padding: 9px 16px;
        cursor: pointer;
      }
      .entry-form button:disabled { opacity: 0.45; cursor: default; }
      .upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .upload-hint { color: var(--muted); font-size: 12px; }
      .form-error { color: #e06c6c; font-size: 13px; margin: 0; }
      .draft-status { color: var(--muted); font-size: 12px; font-style: italic; margin: 0; }
      .draft-badge {
        font-size: 12px;
        color: var(--accent);
        margin-top: 6px;
      }

      .entry-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
      .entry-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .entry-title { font-size: 15px; font-weight: 600; }
      .entry-body {
        font-size: 14px;
        color: var(--text);
        margin-top: 4px;
        white-space: pre-wrap;
      }
      .entry-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }

      .entry-card input,
      .entry-card textarea {
        font: inherit;
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 11px;
        margin-bottom: 8px;
        resize: vertical;
      }
      .entry-card input:focus,
      .entry-card textarea:focus { outline: none; border-color: var(--accent); }

      .entry-actions { display: flex; gap: 8px; margin-top: 8px; }
      .entry-actions button { font: inherit; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
      .btn-primary {
        font-weight: 600;
        background: var(--accent);
        color: #1a1a1a;
        border: none;
      }
      .btn-primary:disabled { opacity: 0.45; cursor: default; }
      .btn-secondary {
        background: none;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover { background: var(--hover); }
      .btn-danger {
        background: none;
        color: #e06c6c;
        border: 1px solid #e06c6c;
      }
      .btn-danger:hover { background: #e06c6c; color: #fff; }
      .btn-danger:disabled { opacity: 0.5; cursor: default; }
      .confirm-row { align-items: center; flex-wrap: wrap; }
      .confirm-text { font-size: 13px; color: var(--muted); margin-right: 4px; }

      .archived-section { margin-top: 28px; }
      .archived-section > summary {
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 6px 0;
        user-select: none;
      }
      .archived-section > summary:hover { color: var(--text); }
      .archived-section .entry-list { margin-top: 12px; }

      /* --- Global Chat drawer (P14) ----------------------------------- */
      /* Fixed toggle, always visible so the drawer is reachable from any
         workspace. The drawer overlays the right edge without taking over
         the app — the rest stays clickable. */
      #chat-toggle {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 30;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        background: var(--accent);
        color: #1a1a1a;
        border: none;
        border-radius: 999px;
        padding: 11px 18px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      }
      #chat-toggle:hover { filter: brightness(1.06); }

      #chat-drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: 380px;
        max-width: 90vw;
        z-index: 40;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.28);
        transform: translateX(100%);
        transition: transform 0.18s ease;
      }
      #chat-drawer.open { transform: translateX(0); }

      .chat-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
      }
      .chat-title { font-size: 16px; font-weight: 600; }
      .chat-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
      #chat-close {
        background: none;
        border: none;
        color: var(--muted);
        font: inherit;
        font-size: 16px;
        line-height: 1;
        padding: 4px 6px;
        cursor: pointer;
        border-radius: 6px;
      }
      #chat-close:hover { background: var(--hover); color: var(--text); }

      .chat-messages { flex: 1; overflow-y: auto; padding: 18px; }
      .chat-empty {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
      }

      .chat-composer {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 14px 18px;
        border-top: 1px solid var(--border);
      }
      .chat-input {
        flex: 1;
        font: inherit;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 11px;
        resize: none;
      }
      .chat-input:disabled { opacity: 0.7; cursor: not-allowed; }
      .chat-composer .btn-primary { padding: 8px 16px; }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="nav"><div class="brand">Revival Studio</div></nav>
      <main id="content"></main>
    </div>

    <!-- Global Chat drawer (P14): reachable from every workspace. Shell only —
         AI send/receive is wired up in a later phase. -->
    <button id="chat-toggle" aria-expanded="false" aria-controls="chat-drawer">
      💬 Chat
    </button>
    <aside id="chat-drawer" aria-hidden="true" aria-label="Chat">
      <header class="chat-header">
        <div class="chat-heading">
          <div class="chat-title">Revival Chat</div>
          <div class="chat-subtitle">Default chat · reachable from anywhere</div>
        </div>
        <button id="chat-close" aria-label="Close chat">✕</button>
      </header>
      <div class="chat-messages">
        <p class="chat-empty">
          This is your project chat — open from any workspace.
          Messaging Claude here is added in a later phase. Attachments will come
          from Source Material only. Nothing here is saved or sent without your
          confirmation.
        </p>
      </div>
      <form class="chat-composer" id="chat-composer">
        <textarea
          class="chat-input"
          rows="2"
          placeholder="Sending is added in a later phase — this is the chat shell."
          disabled
        ></textarea>
        <button type="submit" class="btn-primary" disabled>Send</button>
      </form>
    </aside>

    <script src="renderer.js"></script>
  </body>
</html>
